# Публикация в PyPI при создании релиза

name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: "🚀 Publish to PyPI"
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Для trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true