[project]
name = "rvc"
version = "0.2.0"
description = "Retrieval-based Voice Conversion - Modern Edition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "RVC Team" },
]
dependencies = [
    # === Core ML ===
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",

    # === Audio processing ===
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "pyworld>=0.3.4",
    "praat-parselmouth>=0.4.4",
    "torchcrepe>=0.0.23",
    "torchfcpe>=0.0.4",
    "ffmpeg-python>=0.2.0",
    "av>=14.0.0",

    # === Feature extraction ===
    "fairseq>=0.12.2",

    # === Vector search ===
    "faiss-cpu>=1.8.0",

    # === UI ===
    "gradio>=5.0.0,<6.0.0",

    # === Configuration ===
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",

    # === Training support ===
    "matplotlib>=3.9.0",
    "tensorboardX>=2.6.2",

    # === Utilities ===
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
    "joblib>=1.4.0",
    "pillow>=10.4.0",

    # === Logging ===
    "structlog>=24.4.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.17.0",
]
onnx-gpu = [
    "onnxruntime-gpu>=1.17.0",
]
dml = [
    "torch-directml>=0.2.0",
]
intel-xpu = [
    "intel-extension-for-pytorch>=2.4.0",
]
plots = [
    "plotly>=5.18.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "plotly>=5.18.0",
]

[project.scripts]
rvc = "rvc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rvc"]
# 🔧 Phase 4: PEP 561 — включаем py.typed в wheel для downstream-типизации
artifacts = ["src/rvc/py.typed"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

# === Ruff configuration ===
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "infer/",  # Legacy RVC code — excluded from strict checks
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
    "PERF", # perflint
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "PLR0913",# too many arguments
    "PLR2004",# magic value comparison
    "PLR0912",# too many branches
    "PLR0915",# too many statements
    "PERF401",# manual list comprehension (readability)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]
"benchmarks/*" = ["ARG", "PLR2004"]
"scripts/*" = ["ARG"]

[tool.ruff.format]
quote-style = "double"

# === Mypy configuration ===
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
# 🔧 Phase 4: явное указание пакетов для проверки
files = ["src/rvc"]
exclude = [
    "infer/",
    "tests/",
    "benchmarks/",
    "scripts/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "benchmarks.*"
disallow_untyped_defs = false

# === Pytest configuration ===
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: integration tests",
]

# === Coverage configuration ===
[tool.coverage.run]
source = ["src/rvc"]
omit = [
    "*/tests/*",
    "*/infer/*",
    "*/benchmarks/*",
    "*/scripts/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]